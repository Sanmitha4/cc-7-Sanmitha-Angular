<div class="overlay">
  <div class="panel" [class.show-panel]="shouldShowPanel()">
    <button class="close-btn" (click)="hidePanel()">❌ </button>
    <div> 
        <h2>{{ panelTitle() }}</h2>
        <app-forms-demo
          [locationToEdit]="locationToEdit()"
          [editLocationId]="editLocationId()"
          (locationSaved)="hidePanel(true)"
        ></app-forms-demo>
        
    </div>
  </div>
</div>
