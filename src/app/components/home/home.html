<section>
  <form>
    <input type="text" placeholder="Filter by city" />
    <button class="primary" type="button">Search</button>
  </form>
  <div class="controls">
    <div>
      <label>
        Select Mode:
        <input type="checkbox" (change)="handleCheckbox($event)" />
        {{ mode() === 'edit' ? 'Edit Mode' : 'Normal Mode' }}
      </label>
    </div>

    @if (mode() === 'edit') {
      <div class="action-toggle-group">
        <button
          type="button"
          class="delete-btn"
          [disabled]="selectionCount() === 0"
          (click)="deleteSelected()"
        >
          Delete ({{ selectionCount() }})
        </button>

        @if (canRestore()) {
          <button type="button" class="restore-btn" (click)="restoreSelected()">Restore</button>
        }
      </div>
    }
    <button 
    class="primary add-btn" 
    type="button" 
    (click)="addNewLocation()">
    Add Location
  </button>
</div>

  <section class="results">
    @for (housingLocation of locationService.getAllLocation(); track housingLocation.id) {
      <app-housing-location
        [housingLocation]="housingLocation"
        [mode]="mode()"
        [isSelected]="isSelected(housingLocation.id)"
        (onLocationClick)="handleLocationClick($event)"
      />
    } @empty {
      <p>No locations found.</p>
    }
  </section>
</section>
